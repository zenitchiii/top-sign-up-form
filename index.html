<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="image-section">
        <div class="odin">
            <img id="logo" src="/top-sign-up-form/asset/odin-lined.png">
            <h1 id="odin-text">ODIN</h1>
        </div>
        <p id="reference">Photo by <a href="https://unsplash.com/photos/a-large-group-of-people-standing-in-front-of-a-tall-building-H-Zxev0xrpQ" id="refe">Gabriele Stravinskaite</a> on Unsplash</p>
    </div>
    <div class="text-section">
        <div class="description">
            <p id="disclaimer">This is not a real online service! You know you need something <br>like this in your life to help you realize your deepest dreams. <br>Sign up <i>now</i> to get started<br><br>You <i>know</i> you want to.</p>
        </div>
        <div class="form-section">
            <h3>Let's do this!</h3>
            <div class="form-row">
                <div class="form-group">
                    <label for="first_name">FIRST NAME</label>
                    <input type="text" name="first_name" id="first_name">
                </div>
                <div class="form-group">
                    <label for="last_name">LAST NAME</label>
                    <input type="text" name="last_name" id="last_name">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="email">EMAIL</label>
                    <input type="email" name="email" id="email">
                </div>
                <div class="form-group">
                    <label for="phone_number">PHONE NUMBER</label>
                    <input type="tel" name="phone_number" id="phone_number">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password">CONFIRM PASSWORD</label>
                    <input type="password" id="password" name="confirm_password" required>
                </div>
            </div>
        </div>
        <button type="submit" id="button">Create Account</button>
        <p class="login-text">Already have an account? <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" id="login">Login now</a></p>
    </div>
</body>
</html>
